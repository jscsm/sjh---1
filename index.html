<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="孙家豪 · 信息管理与信息系统 · 个人简历">
<title>孙家豪 · 个人简历</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('theme');
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (sysDark ? 'dark' : 'light'));
  } catch (e) {}
})();
</script>
<style>
:root{
  --primary:#6366f1;
  --primary-strong:#4f46e5;
  --primary-soft:rgba(99,102,241,.12);
  --accent:#06b6d4;
  --accent-strong:#0891b2;
  --gold:#f59e0b;
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#0f172a;
  --text-2:#475569;
  --text-3:#94a3b8;
  --border:#e5e7eb;
  --border-2:#eef0f5;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 8px 24px rgba(15,23,42,.08);
  --shadow-lg:0 18px 48px rgba(79,70,229,.16);
  --ring:rgba(99,102,241,.42);
  --grad:linear-gradient(135deg,#6366f1 0%,#7c3aed 52%,#06b6d4 100%);
  --navbar-h:68px;
}
html[data-theme="dark"]{
  --primary:#818cf8;
  --primary-strong:#a5b4fc;
  --primary-soft:rgba(129,140,248,.16);
  --accent:#22d3ee;
  --accent-strong:#67e8f9;
  --gold:#fbbf24;
  --bg:#0b1020;
  --card:#141c31;
  --text:#e2e8f0;
  --text-2:#9aa7bd;
  --text-3:#64748b;
  --border:#232c44;
  --border-2:#1b2438;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 8px 24px rgba(0,0,0,.45);
  --shadow-lg:0 18px 48px rgba(0,0,0,.5);
  --ring:rgba(129,140,248,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--navbar-h) + 16px)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--text);
  background-color:var(--bg);
  background-image:
    radial-gradient(1100px 480px at 85% -8%,var(--primary-soft),transparent 60%),
    radial-gradient(900px 460px at -8% 16%,rgba(6,182,212,.09),transparent 55%);
  background-attachment:fixed;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s ease,color .25s ease;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
.container{width:100%;max-width:1120px;margin:0 auto;padding:0 24px}
.icon{display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon svg{display:block}

/* ---------- Navbar ---------- */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--navbar-h);
  background:color-mix(in srgb,var(--card) 78%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .2s ease,box-shadow .2s ease,background-color .25s ease;
}
.navbar.scrolled{border-bottom-color:var(--border-2);box-shadow:var(--shadow-sm)}
.navbar-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700}
.brand-badge{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:var(--grad);color:#fff;font-size:17px;box-shadow:var(--shadow-md);
}
.brand-name{font-size:16px;letter-spacing:.2px}
.brand-sub{font-weight:500;color:var(--text-3);font-size:13px;margin-left:4px}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-links a{
  padding:7px 13px;border-radius:9px;font-size:14px;font-weight:500;color:var(--text-2);
  transition:color .15s ease,background-color .15s ease;
}
.nav-links a:hover{color:var(--primary-strong);background:var(--primary-soft)}
.nav-actions{display:flex;align-items:center;gap:9px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--border);color:var(--text-2);background:var(--card);
  transition:transform .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease;
}
.icon-btn:hover{color:var(--primary-strong);border-color:var(--ring);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;
  font-size:14px;font-weight:600;transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease;
}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow-md)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn-ghost{border:1px solid var(--border);color:var(--text-2);background:var(--card)}
.btn-ghost:hover{color:var(--primary-strong);border-color:var(--ring)}
.hamburger{display:none}
.mobile-menu{display:none}

/* ---------- Sections ---------- */
section{padding:72px 0}
.hero{padding-top:calc(var(--navbar-h) + 64px);padding-bottom:64px;text-align:center}
.section-head{max-width:640px;margin:0 auto 44px;text-align:center}
.eyebrow{
  display:inline-block;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--primary-strong);
  background:var(--primary-soft);margin-bottom:14px;
}
h2{font-size:30px;font-weight:800;letter-spacing:-.3px}
.section-head p{color:var(--text-2);margin-top:8px;font-size:15px}

/* ---------- Hero ---------- */
.avatar{
  width:88px;height:88px;border-radius:26px;margin:0 auto 22px;display:grid;place-items:center;
  background:var(--grad);color:#fff;font-size:40px;font-weight:800;
  box-shadow:var(--shadow-lg),0 0 0 8px var(--primary-soft);
}
.hero h1{font-size:44px;font-weight:900;letter-spacing:-.5px;line-height:1.15}
.hero .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .role{margin-top:10px;font-size:17px;color:var(--text-2);font-weight:500}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.hero .summary{max-width:660px;margin:22px auto 0;color:var(--text-2);font-size:15.5px}
.badges{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:26px}
.badge{
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--card);border:1px solid var(--border);color:var(--text-2);
  box-shadow:var(--shadow-sm);transition:transform .15s ease,border-color .15s ease,color .15s ease;
}
.badge:hover{transform:translateY(-2px);border-color:var(--ring);color:var(--primary-strong)}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
.hero-actions .btn{padding:12px 20px}

/* ---------- Highlights ---------- */
.highlight-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:26px 22px;text-align:center;box-shadow:var(--shadow-sm);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.stat-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);border-color:var(--ring)}
.stat-num{font-size:40px;font-weight:900;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.stat-label{font-size:14px;font-weight:600;margin-top:8px;color:var(--text)}
.stat-sub{font-size:12.5px;color:var(--text-3);margin-top:4px}

/* ---------- Tabs ---------- */
.tablist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:32px;padding:5px;background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:max-content;margin-left:auto;margin-right:auto}
.tab{
  padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text-2);
  transition:background-color .15s ease,color .15s ease,box-shadow .15s ease;
}
.tab:hover{color:var(--primary-strong)}
.tab[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:var(--shadow-md)}
.tab:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

/* ---------- Timeline / Experience ---------- */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--primary),var(--accent));opacity:.25;border-radius:2px}
.exp-item{position:relative;margin-bottom:30px}
.exp-item:last-child{margin-bottom:0}
.exp-dot{position:absolute;left:-28px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--primary);display:grid;place-items:center}
.exp-dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--primary)}
.exp-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease}
.exp-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.exp-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:6px}
.exp-role{font-size:18px;font-weight:700}
.exp-org{color:var(--text-2);font-size:14px}
.exp-period{margin-left:auto;font-size:13px;color:var(--text-3);font-weight:600;white-space:nowrap}
.exp-tag{padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--primary-strong);background:var(--primary-soft)}
.exp-bullets{margin-top:12px;list-style:none}
.exp-bullets li{position:relative;padding-left:22px;color:var(--text-2);font-size:14.5px;margin-bottom:8px}
.exp-bullets li::before{content:"";position:absolute;left:2px;top:9px;width:8px;height:8px;border-radius:2px;background:var(--grad);transform:rotate(45deg)}

/* ---------- Projects ---------- */
.project-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.project-card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;
  box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:14px;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.project-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);border-color:var(--ring)}
.project-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.project-title{font-size:19px;font-weight:700}
.project-cat{padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--accent-strong);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.project-stack{display:flex;flex-wrap:wrap;gap:7px}
.stack-tag{font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;background:var(--primary-soft);color:var(--primary-strong)}
.project-points{list-style:none;display:flex;flex-direction:column;gap:8px;flex:1}
.project-points li{font-size:14px;color:var(--text-2);position:relative;padding-left:20px}
.project-points li::before{content:"▸";position:absolute;left:2px;color:var(--primary);font-weight:700}
.project-link{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--primary-strong)}
.project-link:hover{text-decoration:underline}

/* ---------- Skills ---------- */
.skill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.skill-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease}
.skill-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.skill-group{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.skill-group .icon{width:38px;height:38px;border-radius:11px;background:var(--grad);color:#fff}
.skill-group h3{font-size:17px;font-weight:700}
.skill-row{margin-bottom:15px}
.skill-row:last-child{margin-bottom:0}
.skill-row-top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:7px}
.skill-row-top .lv{color:var(--text-3)}
.bar{height:8px;border-radius:999px;background:var(--border-2);overflow:hidden}
.bar>span{display:block;height:100%;width:0;border-radius:999px;background:var(--grad);transition:width .9s cubic-bezier(.22,.61,.36,1)}

/* ---------- Education ---------- */
.edu-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
.edu-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:var(--shadow-sm)}
.edu-school{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.edu-school .icon{width:46px;height:46px;border-radius:13px;background:var(--grad);color:#fff}
.edu-school h3{font-size:19px;font-weight:700}
.edu-school .sub{font-size:13px;color:var(--text-3)}
.edu-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.edu-meta span{padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--primary-soft);color:var(--primary-strong)}
.edu-list{list-style:none}
.edu-list li{position:relative;padding-left:22px;color:var(--text-2);font-size:14.5px;margin-bottom:9px}
.edu-list li::before{content:"";position:absolute;left:2px;top:9px;width:8px;height:8px;border-radius:2px;background:var(--grad);transform:rotate(45deg)}
.cert-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:var(--shadow-sm)}
.cert-card h3{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;margin-bottom:16px}
.cert-card h3 .icon{width:38px;height:38px;border-radius:11px;background:var(--grad);color:#fff}
.cert-item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px dashed var(--border-2)}
.cert-item:last-child{border-bottom:none}
.cert-item .icon{color:var(--gold);margin-top:2px}
.cert-item .t{font-weight:600;font-size:14.5px}
.cert-item .d{font-size:13px;color:var(--text-3);margin-top:2px}
.muted-note{font-size:13px;color:var(--text-3);margin-top:12px;font-style:italic}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--border-2);padding:34px 0}
.footer-inner{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;color:var(--text-3);font-size:13.5px}
.footer-inner b{color:var(--text-2)}

/* ---------- Back to top ---------- */
.back-top{
  position:fixed;right:26px;bottom:26px;z-index:90;width:46px;height:46px;border-radius:13px;
  background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-md);
  opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .2s ease,transform .2s ease,visibility .2s ease;
}
.back-top.show{opacity:1;visibility:visible;transform:translateY(0)}
.back-top:hover{transform:translateY(-3px)}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);z-index:200;
  background:var(--text);color:var(--bg);padding:11px 20px;border-radius:12px;font-size:14px;font-weight:600;
  opacity:0;visibility:hidden;transition:opacity .2s ease,transform .2s ease,visibility .2s ease;box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* ---------- Reveal ---------- */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.reveal.in{opacity:1;transform:none}

/* ---------- Responsive ---------- */
@media(max-width:920px){
  .highlight-grid{grid-template-columns:repeat(2,1fr)}
  .project-grid,.skill-grid,.edu-grid{grid-template-columns:1fr}
}
@media(max-width:720px){
  section{padding:56px 0}
  h2{font-size:26px}
  .hero h1{font-size:36px}
  .nav-links{display:none}
  .hamburger{display:grid}
  .btn-ghost.print-btn{display:none}
  .mobile-menu{display:block;position:absolute;top:var(--navbar-h);left:0;right:0;background:var(--card);border-bottom:1px solid var(--border-2);box-shadow:var(--shadow-md);padding:10px 16px 16px}
  .mobile-menu[hidden]{display:none}
  .mobile-menu a{display:block;padding:12px 10px;border-radius:10px;font-weight:600;color:var(--text-2)}
  .mobile-menu a:hover{background:var(--primary-soft);color:var(--primary-strong)}
  .highlight-grid{grid-template-columns:1fr 1fr;gap:12px}
  .stat-num{font-size:30px}
  .exp-period{margin-left:0}
}

/* ---------- Motion ---------- */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  .reveal{opacity:1;transform:none}
  .bar>span{transition:none}
}

/* ---------- Print ---------- */
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html{scroll-behavior:auto}
  body{background:#fff !important;color:#111 !important}
  .navbar,.back-top,.toast,.tablist,.no-print,.mobile-menu,.hamburger,.icon-btn,.hero-actions .btn-ghost{display:none !important}
  main{padding-top:0 !important}
  .hero{padding-top:0 !important;text-align:left}
  .hero .summary,.hero .role{color:#333 !important}
  .badge,.stat-card,.exp-card,.project-card,.skill-card,.edu-card,.cert-card{background:#fff !important;border:1px solid #ddd !important;box-shadow:none !important}
  section{padding:18px 0 !important;break-inside:avoid}
  .tabpanel{display:block !important}
  .project-card{display:flex !important}
  .stat-num,.hero .grad{color:#111 !important;-webkit-text-fill-color:#111 !important;background:none !important}
  .bar>span{background:#6366f1 !important}
  .reveal{opacity:1 !important;transform:none !important}
  a{text-decoration:none !important;color:inherit !important}
}
</style>
</head>
<body>

<header class="navbar" id="navbar">
  <div class="container navbar-inner">
    <a href="#hero" class="brand">
      <span class="brand-badge">孙</span>
      <span class="brand-name">孙家豪<span class="brand-sub">· 个人简历</span></span>
    </a>
    <nav class="nav-links" aria-label="主导航">
      <a href="#hero">摘要</a>
      <a href="#highlights">亮点</a>
      <a href="#experience">经历</a>
      <a href="#projects">项目</a>
      <a href="#skills">技能</a>
      <a href="#education">教育</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" aria-label="切换深浅色模式" title="切换深浅色模式"></button>
      <button class="btn btn-ghost print-btn no-print" id="printBtn" title="打印或导出 PDF">
        <span class="icon" id="printIcon"></span>打印 / PDF
      </button>
      <button class="icon-btn hamburger no-print" id="menuToggle" aria-label="菜单" aria-expanded="false"></button>
    </div>
  </div>
  <div class="mobile-menu" id="mobileMenu" hidden>
    <a href="#hero">摘要</a>
    <a href="#highlights">亮点</a>
    <a href="#experience">经历</a>
    <a href="#projects">项目</a>
    <a href="#skills">技能</a>
    <a href="#education">教育</a>
  </div>
</header>

<main id="main">
  <section id="hero" class="hero"><div class="container" id="heroRoot"></div></section>
  <section id="highlights"><div class="container" id="highlightsRoot"></div></section>
  <section id="experience"><div class="container" id="experienceRoot"></div></section>
  <section id="projects"><div class="container" id="projectsRoot"></div></section>
  <section id="skills"><div class="container" id="skillsRoot"></div></section>
  <section id="education"><div class="container" id="educationRoot"></div></section>
</main>

<footer><div class="container footer-inner" id="footerRoot"></div></footer>

<button class="back-top no-print" id="backTop" aria-label="返回顶部"></button>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';

/* ============ 简历数据 ============ */
const resume = {
  name: "孙家豪",
  nameEn: "Sun Jiahao",
  role: "信息管理与信息系统 · 本科在读",
  direction: "数据 / AI / 产品运营 方向实习",
  location: "南京",
  contact: {
    phone: "18014111653",
    email: { user: "1293725470", domain: "qq.com" },
    github: ""   // 待补，留空自动隐藏
  },
  summary: "河海大学信息管理与信息系统专业大一新生，大一即考取阿里官方「AI 训练师」认证，兼具 Python 技术功底与班级组织管理经验。结果导向、学习力强，可快速上手数据分析、AI 产品与运营类实习工作。",
  badges: ["Python", "数据分析", "Prompt 工程", "AI 训练", "数据标注", "爬虫", "办公自动化", "Office 办公"],
  highlights: [
    { num: "10+", label: "场班级文体活动组织", sub: "策划执行全程统筹" },

function iconEl(name, size = 18) {
  const s = document.createElement('span');
  s.className = 'icon';
  s.innerHTML = '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  return s;
}

/* ============ DOM 工具 ============ */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else if (v !== false && v !== null && v !== undefined) el.setAttribute(k, v);
    }
  }
  (children || []).flat().forEach(c => {
    if (c === null || c === undefined || c === false) return;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  });
  return el;
}

function setupTabs(tablist, onActivate) {
  const tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
  const activate = (idx) => {
    tabs.forEach((t, i) => {
      const active = i === idx;
      t.setAttribute('aria-selected', String(active));
      t.tabIndex = active ? 0 : -1;
    });
    onActivate && onActivate(idx);
  };
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => activate(i));
    t.addEventListener('keydown', (e) => {
      let idx = null;
      if (e.key === 'ArrowRight') idx = (i + 1) % tabs.length;
      else if (e.key === 'ArrowLeft') idx = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') idx = 0;
      else if (e.key === 'End') idx = tabs.length - 1;
      if (idx !== null) { e.preventDefault(); activate(idx); tabs[idx].focus(); }
    });
  });
  activate(0);
}

/* ============ 交互 ============ */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 1800);
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast('邮箱已复制：' + text);
  } catch (e) {
    toast('复制失败，请手动复制');
  }
}

function initChrome() {
  const navbar = document.getElementById('navbar');
  const backTop = document.getElementById('backTop');
  const menuToggle = document.getElementById('menuToggle');
  const mobileMenu = document.getElementById('mobileMenu');
  const themeToggle = document.getElementById('themeToggle');

  themeToggle.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[document.documentElement.getAttribute('data-theme') === 'dark' ? 'sun' : 'moon'] + '</svg>';

  themeToggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    themeToggle.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[next === 'dark' ? 'sun' : 'moon'] + '</svg>';
  });

  menuToggle.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS.menu + '</svg>';
  menuToggle.addEventListener('click', () => {
    const open = mobileMenu.hidden;
    mobileMenu.hidden = !open;
    menuToggle.setAttribute('aria-expanded', String(open));
    menuToggle.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (open ? ICONS.close : ICONS.menu) + '</svg>';
  });
  mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    mobileMenu.hidden = true;
    menuToggle.setAttribute('aria-expanded', 'false');
    menuToggle.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS.menu + '</svg>';
  }));

  backTop.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + ICONS.arrowUp + '</svg>';
  backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  document.getElementById('printBtn').addEventListener('click', () => window.print());
  const heroPrint = document.getElementById('heroPrint');
  if (heroPrint) heroPrint.addEventListener('click', () => window.print());

  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 10);
    backTop.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });
}

function initReveal() {
  const els = document.querySelectorAll('.reveal');
  const bars = document.querySelectorAll('.bar>span[data-lv]');
  if (!('IntersectionObserver' in window)) {
    els.forEach(e => e.classList.add('in'));
    bars.forEach(b => b.style.width = b.dataset.lv + '%');
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        en.target.querySelectorAll('.bar>span[data-lv]').forEach(x => x.style.width = x.dataset.lv + '%');
        io.unobserve(en.target);
      }
    });
  }, { threshold: 0.12 });
  els.forEach(e => io.observe(e));
  bars.forEach(b => io.observe(b.closest('.reveal') || b));
}

/* ============ 启动 ============ */
renderHero();
renderHighlights();
renderExperience();
renderProjects();
renderSkills();
renderEducation();
renderFooter();
initChrome();
initReveal();

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-copy]');
  if (t) copyText(t.getAttribute('data-copy'));
});
</script>
